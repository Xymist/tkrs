name: Release on tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.0)'
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}
    steps:
      - name: Validate tag
        run: |
          if [ -z "${TAG}" ]; then
            echo "TAG is required for this workflow" >&2
            exit 1
          fi

      - name: Ensure release exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "" --latest --repo "$GITHUB_REPOSITORY"
          fi

  build-and-upload:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux ships a fully static musl binary. Unlike a glibc build it has
          # no libc version dependency, so it runs on any x86_64 Linux distro
          # regardless of GLIBC version. The triple is x86_64-unknown-linux-musl,
          # which is what the self-updater matches against, so a musl-built `tk`
          # only ever pulls the musl asset.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}
      # `ring` (pulled in via rustls) compiles C/asm, so the musl target needs a
      # musl-capable C compiler. cc-rs looks this up per target; point it at the
      # `musl-gcc` wrapper from the musl-tools package. Unused on macOS targets.
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Run tests
        run: cargo nextest run --release --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifact
        id: package
        run: |
          set -euo pipefail
          ARTIFACT="tk-${TAG}-${{ matrix.target }}.tar.gz"
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" -czf "dist/${ARTIFACT}" tk
          echo "artifact_path=dist/${ARTIFACT}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "${{ steps.package.outputs.artifact_path }}" --clobber --repo "$GITHUB_REPOSITORY"
