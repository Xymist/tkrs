name: Release on tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.0)'
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}
    steps:
      - name: Validate tag
        run: |
          if [ -z "${TAG}" ]; then
            echo "TAG is required for this workflow" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Package artifact
        id: package
        run: |
          ARTIFACT="tk-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p dist
          tar -C target/release -czf "dist/${ARTIFACT}" tk
          echo "artifact_path=dist/${ARTIFACT}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ARTIFACT}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ARTIFACT_PATH="${{ steps.package.outputs.artifact_path }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARTIFACT_PATH" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$ARTIFACT_PATH" --title "$TAG" --notes "" --latest --repo "$GITHUB_REPOSITORY"
          fi
