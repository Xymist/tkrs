[package]
name = "ticket"
version = "0.7.2"
edition = "2024"

[lib]
name = "ticket"
path = "src/lib.rs"

[[bin]]
name = "tk"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = { version = "0.30.1", features = ["unstable-rendered-line-info"] }
color-eyre = "0.6.5"
tui-nodes = "0.10.0"
tui-tree-widget = "0.24.0"
serde_yaml = "0.9.34"
self_update = { version = "0.44.0", default-features = false, features = [
  "ureq",
  "rustls",
  "archive-tar",
  "compression-flate2",
] }

[dev-dependencies]
assert_cmd = "2.0"
assert_fs = "1.1"
predicates = "3.1"
filetime = "0.2"
